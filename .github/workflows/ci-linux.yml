name: CI (Linux)

on:
  push:
    branches: [main]
    paths:
      - 'platforms/linux/**'
      - 'platforms/macos/Package.swift'
      - 'platforms/macos/Sources/PortKillerKit/**'
      - 'platforms/macos/Tests/**'
      - '.github/workflows/ci-linux.yml'
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'platforms/linux/**'
      - 'platforms/macos/Package.swift'
      - 'platforms/macos/Sources/PortKillerKit/**'
      - 'platforms/macos/Tests/**'
      - '.github/workflows/ci-linux.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Core (Linux)
    runs-on: ubuntu-latest
    # Swift 6.4 has no official Docker image yet; switch to swift:6.4-noble once it's published.
    container: swiftlang/swift:nightly-6.4.x-noble
    defaults:
      run:
        shell: bash
        working-directory: platforms/macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: platforms/macos/.build
          key: ${{ runner.os }}-swift64-spm-${{ hashFiles('platforms/macos/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift64-spm-

      - name: Build
        run: swift build --build-tests 2>&1 | tee build.log

      - name: Report warnings
        run: |
          if grep -E "^/.*warning:" build.log | grep -v "/.build/"; then
            echo "::warning::Compiler warnings found"
          else
            echo "No compiler warnings."
          fi

      - name: Test
        run: swift test --parallel

  python:
    name: Linux Tray App
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python3 -m compileall -q platforms/linux/src platforms/linux/port-killer.py

      - name: Run parser tests
        # These cover pure string parsing only, so no GTK stack is needed.
        run: python3 -m unittest discover -s platforms/linux/tests -v

      - name: Validate installer
        run: |
          bash -n platforms/linux/install.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck platforms/linux/install.sh

  smoke:
    name: Import Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 xvfb

      - name: Import all modules
        # Catches broken imports and syntax errors that the parser tests,
        # which never touch the GTK modules, would miss.
        run: |
          cd platforms/linux
          xvfb-run -a python3 -c "
          import src.config, src.scanner
          import src.services.clipboard, src.services.cloudflare, src.services.k8s
          import src.ui.dialogs, src.ui.window, src.ui.tray
          print('All modules import cleanly')
          "
