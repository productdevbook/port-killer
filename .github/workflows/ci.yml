name: CI

on:
  push:
    branches: [main]
    paths:
      - 'platforms/macos/**'
      - '.github/workflows/ci.yml'
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'platforms/macos/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: platforms/macos

jobs:
  build:
    name: Build & Test
    runs-on: xcode-27

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            platforms/macos/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode27-spm-${{ hashFiles('platforms/macos/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode27-spm-

      - name: Build
        run: swift build 2>&1 | tee build.log

      - name: Report warnings
        run: |
          if grep -E "^/.*warning:" build.log | grep -v "/.build/"; then
            echo "::warning::Compiler warnings found"
          else
            echo "No compiler warnings."
          fi

      - name: Test
        run: swift test --parallel

      - name: Build app bundle
        run: |
          Scripts/build-app.sh
          APP=build/PortKiller.app
          [ -x "$APP/Contents/MacOS/PortKiller" ] || { echo "Missing executable"; exit 1; }
          [ -f "$APP/Contents/Info.plist" ] || { echo "Missing Info.plist"; exit 1; }
          [ -d "$APP/Contents/Frameworks/Sparkle.framework" ] || { echo "Missing Sparkle framework"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/PortKiller" | grep -q arm64 || { echo "Missing arm64"; exit 1; }
          codesign --verify --deep --strict "$APP"
